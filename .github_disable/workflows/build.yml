name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore FireAxe.sln

      - name: Build
        run: dotnet build FireAxe.sln -c Release --no-restore

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FireAxe-win-x64
          path: FireAxe.WinUI3/bin/x64/Release/net10.0-windows10.0.26100.0/
          if-no-files-found: warn
